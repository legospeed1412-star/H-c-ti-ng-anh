function lesson(ids,n){isN=n;qm=0;res={};log=[];L0=ids;Q=[...(n?ids.map(id=>({id,k:'cd'})):[]),...ids.map(id=>({id,k:'mc'})),...ids.map(id=>({id,k:'ty'}))];step()}
function step(){if(!Q.length)return qm?qres():fin();cur=Q.shift();T0=Date.now();const w=D[cur.id],f={cd:()=>card(cur.id,'step()'),mc:mcQ,ty:tyQ,cl:clQ,ls:lsQ,wr:wrQ,mt:mtQ}[cur.k];f()}
function fin(){L0.forEach(id=>{if(res[id]!==false)up(id,isN);else if(isN){const c=C(id);c.s=1;c.b=0;c.d=today();dy().n++}});save();V(`<h2 class=ct>✅ Xong bài ${L0.length} từ!</h2><p class=ct>${L0.filter(i=>res[i]!==false).length} từ trả lời đúng ngay lần đầu.</p><button class=bt onclick="go()">Học tiếp</button><button class="bt o" onclick="sum()">Xem tổng kết</button>`)}
function ans(ok,fb,k){const id=cur.id,ms=Date.now()-T0;mark(id,ok,k);if(qm)log.push({id,ok,ms,k:cur.k});else if(!ok){res[id]=false;Q.splice(Math.min(3,Q.length),0,{id,k:cur.k=='ty'?'ty':'mc'})}
 pop(ok);if(ok)setTimeout(step,700);else{$('#fb').innerHTML=fb+'<button class=bt onclick="step()">Đã hiểu, tiếp ▶</button>';say(D[id].w,.8)}}
const head=(id,sp)=>`<div class=w>${sp}</div>`;
function opts(id,tf,pf,val){const o=shuf([id,...shuf(D.map((_,i)=>i).filter(i=>i!=id&&D[i].v!=D[id].v)).slice(0,3)]);return o.map(i=>`<button class="bt o" onclick="pick(this,${i==id})">${tf(D[i])}</button>`).join('')}
function pick(b,ok){if(b.dataset.d)return;document.querySelectorAll('#o .bt').forEach(x=>x.dataset.d=1);b.className='bt '+(ok?'ok':'no');ans(ok,`Đáp án đúng: <b>${D[cur.id].w}</b> = ${D[cur.id].v}`,cur.k=='ls'?'r':'q')}

function lsQ(){const w=D[cur.id];V(`<div class=w>🎧</div><div class=ct><button class="bt s" onclick="say('${w.w}')">🔊 Nghe</button><button class="bt s o" onclick="say('${w.w}',.5)">🐢 Chậm</button></div><p class=ct>Bạn nghe được từ nào?</p><div id=o>${opts(cur.id,x=>x.w)}</div><div id=fb></div>`);say(w.w)}
function clQ(){const w=D[cur.id],r=alts(w.w)[0].split(' ')[0],rx=new RegExp('\\b'+r.slice(0,Math.max(3,r.length-3))+'\\w*','i');if(!rx.test(w.e)){cur.k='mc';return mcQ()}
 V(`<p class=ct>Điền từ vào chỗ trống:</p><div class="cd ct">${w.e.replace(rx,'_____')}</div><small>${w.v}</small><div id=o>${opts(cur.id,x=>x.w)}</div><div id=fb></div>`)}
function tyQ(){const w=D[cur.id],a=alts(w.w)[0],m=cur.k=='wr'?3:Math.random()*3|0;let h;
 if(m==0)h='<div class=w>🎧</div><div class=ct><button class="bt s" onclick="say(\''+a+'\')">🔊 Nghe</button><button class="bt s o" onclick="say(\''+a+'\',.5)">🐢 Chậm</button></div>';
 else if(m==1)h='<div class=w>'+[...a].map((c,i)=>i&&c!=' '&&Math.random()<.45?'_':c).join(' ')+'</div>';
 else if(m==2)h='<div class=w>'+shuf([...a.replace(/ /g,'')]).join(' ')+'</div><p class=ct>Sắp xếp chữ cái</p>';
 else h='';
 V(`${h}<p class=ct><b>${w.v}</b></p><input id=i autocapitalize=off autocomplete=off spellcheck=false placeholder="Gõ từ tiếng Anh" onkeydown="event.key=='Enter'&&chk()"><button class=bt onclick="chk()">Kiểm tra</button><div id=fb></div>`);if(m==0)say(a);$('#i').focus()}

function chk(){const v=$('#i').value.trim().toLowerCase().replace(/\s+/g,' '),a=alts(D[cur.id].w),ok=a.includes(v);if($('#fb').innerHTML)return;ans(ok,`Đáp án đúng: ${dif(a[0],v)}`,'w')}
function mtQ(){const ids=cur.ids,L=shuf(ids),R=shuf(ids);let sel=null,err=0,left=ids.length;
 V(`<p class=ct>Ghép từ với nghĩa</p><div style="display:flex;gap:8px"><div style="flex:1">${L.map(i=>`<button class="bt o" data-s=l data-i=${i}>${D[i].w}</button>`).join('')}</div><div style="flex:1">${R.map(i=>`<button class="bt o" data-s=r data-i=${i}>${D[i].v}</button>`).join('')}</div></div><div id=fb></div>`);
 document.querySelectorAll('#m [data-i]').forEach(b=>b.onclick=()=>{if(b.dataset.s=='l'){say(D[b.dataset.i].w);}if(!sel||sel.dataset.s==b.dataset.s){sel&&(sel.style.outline='');sel=b;b.style.outline='3px solid var(--p)';return}
  if(sel.dataset.i==b.dataset.i){[sel,b].forEach(x=>{x.className='bt ok';x.disabled=1});mark(+b.dataset.i,true,'q');log.push({id:+b.dataset.i,ok:true,ms:0,k:'mt'});left--;sel=null;pop(1);if(!left)setTimeout(step,600)}
  else{err++;mark(+sel.dataset.i,false,'q');log.push({id:+sel.dataset.i,ok:false,ms:0,k:'mt'});sel.style.outline='';sel=null;pop(0)}})}

function card(id,nx){const w=D[id],c=G(id),fam=w.f||[];
 V(`<div class=ct style="font-size:64px">${w.j||TP[w.t][2]}</div>${head(0,w.w)}<div class=ip>${w.i}</div>
 <div class=ct><button class="bt s" onclick="say('${w.w.replace(/'/g,'')}')">🔊 Thường</button><button class="bt s o" onclick="say('${w.w.replace(/'/g,'')}',.5)">🐢 Chậm</button><button class="bt s o" onclick="rd(${id})">🎤 Tự đọc</button></div><div id=mic class=ct></div>

function rd(id){const R=window.SpeechRecognition||window.webkitSpeechRecognition,e=$('#mic');if(!R){e.innerHTML='<small>Máy này chưa hỗ trợ mic. Hãy thử Chrome hoặc Safari mới.</small>';return}

async function ai(id,nx){const e=$('#ai'),w=D[id];const q=`Từ tiếng Anh: ${w.w} ${w.i}, nghĩa: ${w.v}. Viết MỘT mẹo nhớ ngắn bằng tiếng Việt (tối đa 30 từ), ưu tiên cách đọc na ná tiếng Việt hoặc hình ảnh liên tưởng vui. Chỉ trả về mẹo, không giải thích.`;e.textContent='✨ Đang nghĩ...';try{const s=window.claude&&await claude.use('sample');if(!s){try{await navigator.clipboard.writeText(q)}catch(x){}e.innerHTML='Bản này chưa có AI tích hợp. Mình đã chép sẵn câu hỏi, bạn mở Claude, dán vào, rồi chép mẹo về nút ✏️ để lưu.<br><a class="bt s" target=_blank rel=noopener href="https://claude.ai/new?q='+encodeURIComponent(q)+'">🤖 Mở Claude để hỏi</a>';return}const r=await s(q,{modelTier:'quick'}),t=r.text.trim();e.textContent=t+' ';const b=document.createElement('button');b.className='bt s';b.textContent='💾 Lưu mẹo này';b.onclick=()=>{C(id).m=t;save();card(id,nx)};e.append(b)}catch(x){e.textContent='Không lấy được gợi ý, thử lại sau.'}}

 const ids=shuf(p).slice(0,n),ty=mode=='q'?['mc','cl','ls']:['mc','cl','ls','wr'];qm=mode;log=[];Q=ids.map((id,i)=>({id,k:ty[i%ty.length]}));

 S.tests.push({d:today(),mo:new Date(Date.now()+252e5).toISOString().slice(0,7),m:qm,sc:pc(ok,n),n});save();const wr=[...new Set(log.filter(x=>!x.ok).map(x=>x.id))];

 const bad=ids.filter(i=>G(i).no>0).sort((a,b)=>G(b).no-G(a).no).slice(0,10),P=plan(),mo={};S.tests.forEach(x=>(mo[x.mo]=mo[x.mo]||[]).push(x.sc));
